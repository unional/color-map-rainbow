parsers:
  "**/*.cjs": "es6"
  "**/*.mjs": "es6"
  "**/*.ts": "typescript"
ignores:
  # Resolved by name from config rather than imported, so depcheck cannot see them.
  - "@types/node"
  - "@vitest/coverage-v8"
  - "@repobuddy/biome"
  # Run by the husky commit-msg hook and loaded through commitlint.config.cjs.
  - "@commitlint/cli"
  - "@commitlint/config-conventional"
  # Used only as a bin in package.json scripts.
  - "@biomejs/biome"
  - rimraf
