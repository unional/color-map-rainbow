name: release
on:
  push:
    branches: [main]

jobs:
  code:
    uses: cyberuni/.github/.github/workflows/pnpm-verify.yml@v2
    with:
      os: '["ubuntu-latest"]'
      skip-playwright: true

  # Runs on the default branch immediately before `changeset publish`, so a tarball that
  # trips the gate blocks the release. A `needs:` of release, so it also runs on pushes
  # that only open or update the Version PR rather than publish — deliberate, it fails
  # closed.
  publish-gate:
    uses: cyberuni/.github/.github/workflows/pnpm-publish-gate.yml@v2
    permissions:
      contents: read

  release:
    uses: cyberuni/.github/.github/workflows/pnpm-release-changeset-oidc.yml@v2
    needs: [code, publish-gate]
    permissions:
      id-token: write
      contents: write
      pull-requests: write

  # No docgen job. typedoc reaches into the TypeScript compiler's internal
  # SyntaxKind, which the TypeScript 7 native port does not expose the same way,
  # so typedoc 0.28 crashes on load against it. The public API is two exports and
  # the README documents both. cyberuni/color-map runs no docgen either.
  #
  # The existing gh-pages site stays up, frozen at its last build.
